apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinyops-api
  labels:
    app.kubernetes.io/name: tinyops-api
    app.kubernetes.io/version: devops-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tinyops-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tinyops-api
        app.kubernetes.io/version: devops-local
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: tinyops-api
          image: tinyops:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: tinyops-api
  labels:
    app.kubernetes.io/name: tinyops-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tinyops-api
  ports:
    - name: http
      port: 80
      targetPort: http
